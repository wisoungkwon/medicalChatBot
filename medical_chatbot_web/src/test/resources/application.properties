# 테스트 전용 설정.
# src/main/resources/application.properties 를 완전히 대체한다.
#
# 목적: 테스트가 로컬 MySQL/MariaDB 에 의존하지 않게 한다.
# 예전에는 운영 설정을 그대로 써서 DB 가 없는 PC 에서는 contextLoads 조차
# 실패했고, 그래서 아무도 테스트를 돌리지 않았다.
spring.datasource.url=jdbc:h2:mem:medbot;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

python.api.url=http://localhost:5050
app.base-url=http://localhost:8080
app.api-url=http://localhost:5050/ask_symptoms

# 테스트에서는 실제 쿠키 정책을 확인하지 않으므로 기본값으로 둔다.
server.servlet.session.cookie.secure=false
