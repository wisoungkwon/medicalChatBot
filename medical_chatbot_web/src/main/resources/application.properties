# ==================================================================
# 데이터베이스
# ==================================================================
# ${VAR:기본값} 형식이므로 환경변수가 있으면 그 값이, 없으면 기본값이 쓰입니다.
# 운영/공유 환경에서는 반드시 환경변수로 넘기고, 비밀번호를 이 파일에
# 평문으로 두지 마세요. (이 파일은 Git에 올라갑니다)
#   예) set DB_PASSWORD=...   (Windows)
#       export DB_PASSWORD=...  (macOS/Linux)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/teamproject?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# 서버가 MariaDB 인 경우(MySQL Connector/J 는 MariaDB 12.x 메타데이터를 못 읽는다):
#   DB_URL=jdbc:mariadb://localhost:3306/teamproject
#   DB_DRIVER=org.mariadb.jdbc.Driver
#   JPA_DIALECT=org.hibernate.dialect.MariaDBDialect
# 비워두면 Hibernate 가 접속 메타데이터로 자동 판별한다(MySQL 기본).
spring.jpa.database-platform=${JPA_DIALECT:}

# TODO: 운영에서는 validate + Flyway 로 전환하세요.
#       update 는 엔티티 변경이 운영 스키마를 조용히 바꿀 수 있습니다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# 기본을 false 로 둔다. true 면 요청마다 실행된 SQL 이 콘솔에 찍혀
# 로그가 묻히고, 테이블/컬럼 구조가 그대로 드러난다.
# (바인딩 값까지 보려면 아래 TRACE 를 함께 켜야 한다. 그 값에는 환자
#  정보가 들어가므로 운영에서는 켜지 말 것.)
#   예) set JPA_SHOW_SQL=true
#       set LOGGING_LEVEL_SQL_BIND=TRACE
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=${LOGGING_LEVEL_SQL_BIND:OFF}

# 엔티티에 지연 로딩 연관이 없으므로 뷰 렌더링 중 DB 세션을 열어 둘 이유가 없다.
# (기본값 true 는 기동할 때마다 경고를 남긴다)
spring.jpa.open-in-view=false

# ==================================================================
# AI (Flask) 백엔드
# ==================================================================
# 서버 → Flask 직접 호출용 (ChatController). 컨테이너/호스트 내부 주소.
python.api.url=${PYTHON_API_URL:http://localhost:5050}

# ==================================================================
# 외부 노출 주소
# ==================================================================
# app.base-url : QR 코드에 들어가는 이 서버의 외부 주소.
#                /qrcode 는 이 주소 하위 URL 만 QR로 만들어 줍니다.
# app.api-url  : 브라우저가 직접 호출하는 Flask 주소 (chatbot.html 에 주입).
#
# ngrok 은 재시작할 때마다 주소가 바뀝니다. 하드코딩해 두면 그때마다 깨지므로
# 환경변수로 넘기는 편이 편합니다.
#   예) set APP_BASE_URL=https://xxxx.ngrok-free.app
#       set APP_API_URL=https://yyyy.ngrok-free.app/ask_symptoms
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.api-url=${APP_API_URL:http://localhost:5050/ask_symptoms}

# ==================================================================
# 세션 / 쿠키
# ==================================================================
# 이 앱의 인증은 전적으로 JSESSIONID 세션 쿠키에 의존한다.
#   http-only : JS 가 세션 쿠키를 읽지 못하게 한다 (XSS 시 탈취 방어).
#               CSRF 토큰 쿠키(XSRF-TOKEN)는 JS 가 읽어야 하므로 별개다.
#   same-site : 외부 사이트에서 시작된 요청에 세션 쿠키가 실리지 않게 한다.
#               CSRF 토큰과 함께 이중 방어가 된다.
#   secure    : HTTPS 로 서비스할 때 반드시 true 로 켠다.
#               로컬 http 개발에서 켜면 쿠키가 아예 저장되지 않으므로 기본은 false.
#               예) set SESSION_COOKIE_SECURE=true
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 오류 응답에 스택트레이스/예외 메시지를 싣지 않는다(정보 노출 방지).
server.error.include-stacktrace=never
server.error.include-message=never
